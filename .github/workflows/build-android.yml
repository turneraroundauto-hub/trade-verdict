name: Build Android App Bundle

# Manual trigger only — tap "Run workflow" in the Actions tab (works fine
# from the GitHub mobile app or a phone browser) whenever a new build of
# the Android app is needed.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap (JDK + Android SDK paths)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_HOME"}
          EOF

      - name: Decode signing keystore from secret
        # -d -i (ignore-garbage) tolerates stray whitespace/line-wrapping that can get
        # picked up when the base64 blob is copy-pasted through a phone/browser into the
        # secret field. The size check below fails fast with a clear message instead of a
        # cryptic keytool error later if the secret ended up empty or badly mangled anyway.
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d -i > android.keystore
          size=$(stat -c%s android.keystore)
          echo "Decoded keystore size: $size bytes"
          if [ "$size" -lt 500 ]; then
            echo "::error::Decoded keystore is only $size bytes — the ANDROID_KEYSTORE_BASE64 secret is likely wrong, truncated, or empty. Re-copy the full contents of android.keystore.base64.txt into that secret."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build and sign
        run: bubblewrap build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

      - name: Remove keystore from the runner
        if: always()
        run: rm -f android.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: trade-tribunal-android-release
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 90
