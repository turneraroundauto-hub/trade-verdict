name: Build Android App Bundle

# Manual trigger only — tap "Run workflow" in the Actions tab (works fine
# from the GitHub mobile app or a phone browser) whenever a new build of
# the Android app is needed.
on:
  workflow_dispatch:

# contents: write -- needed by the "Publish APK for direct download" step
# below, which pushes the built .apk to a scratch branch in this same repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap (JDK + Android SDK paths)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_HOME"}
          EOF

      - name: Decode signing keystore from secret
        # -d -i (ignore-garbage) tolerates stray whitespace/line-wrapping that can get
        # picked up when the base64 blob is copy-pasted through a phone/browser into the
        # secret field. The size check below fails fast with a clear message instead of a
        # cryptic keytool error later if the secret ended up empty or badly mangled anyway.
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d -i > android.keystore
          size=$(stat -c%s android.keystore)
          echo "Decoded keystore size: $size bytes"
          if [ "$size" -lt 500 ]; then
            echo "::error::Decoded keystore is only $size bytes — the ANDROID_KEYSTORE_BASE64 secret is likely wrong, truncated, or empty. Re-copy the full contents of android.keystore.base64.txt into that secret."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Sanitize password secrets
        # Same class of fix as the keystore decode step above: trims stray whitespace
        # a mobile paste can pick up, then re-masks the cleaned value explicitly since
        # GitHub only auto-masks the exact original secret string, not a derived one.
        run: |
          ks_pw="$(printf '%s' "$RAW_KS_PW" | tr -d '[:space:]')"
          key_pw="$(printf '%s' "$RAW_KEY_PW" | tr -d '[:space:]')"
          echo "::add-mask::$ks_pw"
          echo "::add-mask::$key_pw"
          echo "KEYSTORE_PW_CLEAN=$ks_pw" >> "$GITHUB_ENV"
          echo "KEY_PW_CLEAN=$key_pw" >> "$GITHUB_ENV"
        env:
          RAW_KS_PW: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          RAW_KEY_PW: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}

      - name: Build and sign
        # `bubblewrap build` checks twa-manifest.json against a stored
        # manifest-checksum.txt and, on any drift, prompts interactively
        # ("There are changes in twa-manifest.json. Would you like to apply
        # them to the project before building?", default answer: yes) --
        # there's no CLI flag to skip this, and with no TTY in CI it fails
        # immediately (exit 130) instead of blocking. First hit the moment
        # anyone edited twa-manifest.json post-scaffold (an orientation
        # change), since every prior run never touched that file.
        #
        # Answered "n", not "y": accepting would run bubblewrap's own
        # `update`, which regenerates build.gradle from twa-manifest.json +
        # bubblewrap's own template defaults -- silently reverting the
        # androidbrowserhelper version bump (2.6.2 -> 2.7.3, hand-edited
        # directly in build.gradle for the edge-to-edge fix, since
        # twa-manifest.json has no field for that dependency version at
        # all) back to whatever this bubblewrap/cli release still bundles.
        # Declining keeps the already-correct, hand-verified build.gradle
        # exactly as committed and proceeds straight to the real build --
        # safe here because every twa-manifest.json field that actually
        # matters for the generated app (orientation included) is mirrored
        # by hand into build.gradle already, per this repo's own documented
        # "build.gradle is a static Groovy map, not dynamically read from
        # twa-manifest.json at build time" behavior.
        run: printf 'n\n' | bubblewrap build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PW_CLEAN }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PW_CLEAN }}

      - name: Remove keystore from the runner
        if: always()
        run: rm -f android.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: trade-tribunal-android-release
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 90

      - name: Publish APK + AAB for direct download
        # The Actions artifact above (actions/upload-artifact) is only
        # downloadable via a signed Azure Blob Storage URL -- unreachable
        # from a sandboxed session's own egress policy, the same class of
        # problem this file's own CLAUDE.md history already solved once for
        # other file handoffs ("route around the need instead of hunting
        # for a workaround"). This runner has normal internet access, so it
        # pushes both build outputs directly into the repo instead: stable
        # filenames on a scratch branch, overwritten on every build, giving
        # unchanging raw.githubusercontent.com URLs that always serve the
        # latest build -- the .apk installable straight from a phone
        # browser (sideload only; will conflict with a Play-Store-signed
        # install of the same package -- see the .aab below for that case),
        # the .aab for uploading as a new Play Console release (Play
        # re-signs it, so this is the correct artifact when the device
        # already has a Play-installed copy of this app).
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VCODE=$(node -e "console.log(require('./android/twa-manifest.json').appVersionCode)")
          cp android/app-release-signed.apk /tmp/trade-tribunal-latest.apk
          cp android/app-release-bundle.aab /tmp/trade-tribunal-latest.aab

          # `bubblewrap build` rewrites android/app/src/main/res/xml/shortcuts.xml
          # (and possibly other generated resources) as a normal build side effect,
          # independent of the twa-manifest.json regeneration prompt declined above
          # -- leaves the working tree with real uncommitted changes that block a
          # plain `git checkout <other branch>` ("would be overwritten by checkout").
          # Safe to discard unconditionally here: everything this step needs from
          # the build (the .apk/.aab) is already copied out to /tmp above.
          git reset --hard HEAD
          git clean -fd

          if git ls-remote --exit-code --heads origin store-assets/android-builds >/dev/null 2>&1; then
            git fetch origin store-assets/android-builds:store-assets/android-builds
            git checkout store-assets/android-builds
          else
            git checkout --orphan store-assets/android-builds
            git rm -rf --cached . >/dev/null 2>&1 || true
            git clean -fd
          fi

          mkdir -p android-builds
          cp /tmp/trade-tribunal-latest.apk android-builds/trade-tribunal-latest.apk
          cp /tmp/trade-tribunal-latest.aab android-builds/trade-tribunal-latest.aab
          git add android-builds/trade-tribunal-latest.apk android-builds/trade-tribunal-latest.aab
          if ! git diff --cached --quiet; then
            git commit -m "Publish Android build v$VCODE ($GITHUB_SHA)"
            git push origin store-assets/android-builds
          else
            echo "Build outputs unchanged since last publish -- nothing to push."
          fi
